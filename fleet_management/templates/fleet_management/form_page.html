{% extends 'base.html' %}

{% block title %}{{ title }} - Fleet Management{% endblock %}

{% block header_title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50 flex items-center justify-between">
            <h2 class="text-base font-bold text-slate-800">{{ title }}</h2>
            <a href="/?tab={{ active_tab|default:'warehouses' }}" class="text-xs text-slate-500 hover:text-slate-700">
                <i class="fa-solid fa-xmark text-sm"></i>
            </a>
        </div>

        <form method="post" class="p-6 space-y-5">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="pt-4 border-t border-slate-100 flex items-center justify-end space-x-3">
                <a href="/?tab={{ active_tab|default:'warehouses' }}" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition">
                    Cancel
                </a>
                <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow-sm shadow-indigo-600/20 transition">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
